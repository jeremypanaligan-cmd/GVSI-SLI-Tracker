<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Fiber lines -->
  <g filter="url(#glow)">
    <path d="M 100 256 Q 160 256, 200 220 Q 230 192, 256 192" 
          fill="none" stroke="#00F2FE" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <path d="M 256 192 Q 282 192, 312 220 Q 352 256, 412 256" 
          fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Central target -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#targetGrad)" stroke-width="5" opacity="0.3"/>
  <circle cx="256" cy="256" r="56" fill="none" stroke="#10B981" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="256" r="36" fill="#10B981" opacity="0.15"/>
  <circle cx="256" cy="256" r="36" fill="none" stroke="#10B981" stroke-width="3"/>
  <circle cx="256" cy="256" r="14" fill="#10B981"/>
  <circle cx="256" cy="256" r="7" fill="#0F172A"/>
  <circle cx="256" cy="256" r="3.5" fill="#00F2FE"/>

  <!-- SLI text -->
  <text x="256" y="390" text-anchor="middle" 
        font-family="Arial, sans-serif" font-weight="900" font-size="80" 
        fill="#FFFFFF" letter-spacing="14" opacity="0.95">SLI</text>
</svg>
