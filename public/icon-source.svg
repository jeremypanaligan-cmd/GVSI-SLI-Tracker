<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <!-- Cyan glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Fiber line gradient -->
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F2FE;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <!-- Target ring gradient -->
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06">
    <line x1="128" y1="0" x2="128" y2="512" stroke="#00F2FE" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#00F2FE" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#00F2FE" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#00F2FE" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#00F2FE" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#00F2FE" stroke-width="1"/>
  </g>

  <!-- Fiber optic line — left side -->
  <g filter="url(#glow)">
    <path d="M 80 256 Q 140 256, 180 220 Q 220 184, 260 184" 
          fill="none" stroke="url(#fiberGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Fiber pulse dots -->
    <circle cx="100" cy="256" r="4" fill="#00F2FE" opacity="0.6"/>
    <circle cx="140" cy="244" r="5" fill="#00F2FE" opacity="0.8"/>
    <circle cx="180" cy="220" r="6" fill="#00F2FE" opacity="1"/>
  </g>

  <!-- Central target node -->
  <g transform="translate(256, 256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#targetGrad)" stroke-width="5" opacity="0.4"/>
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#10B981" stroke-width="4" opacity="0.6"/>
    <!-- Inner filled circle -->
    <circle cx="0" cy="0" r="36" fill="#10B981" opacity="0.15"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#10B981" stroke-width="3"/>
    <!-- Center dot — the checkpoint -->
    <circle cx="0" cy="0" r="12" fill="#10B981"/>
    <circle cx="0" cy="0" r="6" fill="#0F172A"/>
    <circle cx="0" cy="0" r="3" fill="#00F2FE"/>
  </g>

  <!-- Fiber optic line — right side (outgoing) -->
  <g filter="url(#glow)">
    <path d="M 260 184 Q 300 184, 340 220 Q 380 256, 432 256" 
          fill="none" stroke="url(#fiberGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Fiber pulse dots -->
    <circle cx="340" cy="220" r="6" fill="#10B981" opacity="1"/>
    <circle cx="380" cy="244" r="5" fill="#10B981" opacity="0.8"/>
    <circle cx="412" cy="256" r="4" fill="#10B981" opacity="0.6"/>
  </g>

  <!-- Status indicator — top right -->
  <g transform="translate(390, 110)">
    <circle cx="0" cy="0" r="18" fill="#10B981" opacity="0.2"/>
    <circle cx="0" cy="0" r="10" fill="#10B981"/>
    <path d="M -5 0 L -2 3 L 5 -4" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Connection nodes along the line -->
  <circle cx="180" cy="220" r="5" fill="#0F172A" stroke="#00F2FE" stroke-width="2"/>
  <circle cx="340" cy="220" r="5" fill="#0F172A" stroke="#10B981" stroke-width="2"/>

  <!-- "SLI" text -->
  <text x="256" y="380" text-anchor="middle" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" font-size="72" fill="#FFFFFF" 
        letter-spacing="12" opacity="0.95">SLI</text>

  <!-- Subtle tagline -->
  <text x="256" y="410" text-anchor="middle" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="500" font-size="18" fill="#00F2FE" 
        letter-spacing="6" opacity="0.6">TRACKER</text>
</svg>
