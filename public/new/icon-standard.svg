<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
    </filter>
    <filter id="glowEmerald" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <!-- Background: Dark Slate Navy, full bleed -->
  <rect x="0" y="0" width="512" height="512" fill="#0F172A"/>

  <!-- Soft emerald status glow behind target node -->
  <circle cx="350" cy="175" r="92" fill="#10B981" opacity="0.16" filter="url(#glowEmerald)"/>

  <!-- Fiber line glow pass -->
  <path d="M 86 430 C 170 430, 190 260, 350 175" fill="none" stroke="#00F2FE" stroke-width="22" stroke-linecap="round" opacity="0.28" filter="url(#glowCyan)"/>

  <!-- Fiber optic connection line -->
  <path d="M 86 430 C 170 430, 190 260, 350 175" fill="none" stroke="#00F2FE" stroke-width="13" stroke-linecap="round"/>

  <!-- Origin / service source point -->
  <circle cx="86" cy="430" r="17" fill="#00F2FE"/>
  <circle cx="86" cy="430" r="26" fill="none" stroke="#00F2FE" stroke-width="3" opacity="0.4"/>

  <!-- Data / signal pulse markers along the fiber line -->
  <circle cx="169" cy="365" r="8" fill="#00F2FE" opacity="0.85"/>
  <circle cx="212" cy="301" r="6.5" fill="#00F2FE" opacity="0.6"/>
  <circle cx="269" cy="234" r="5" fill="#00F2FE" opacity="0.4"/>

  <!-- Target checkpoint node: outer ring -->
  <circle cx="350" cy="175" r="62" fill="none" stroke="#10B981" stroke-width="10"/>

  <!-- Target checkpoint node: filled core -->
  <circle cx="350" cy="175" r="44" fill="#10B981"/>

  <!-- Installation status checkmark -->
  <path d="M 330 177 L 344 191 L 372 159" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
